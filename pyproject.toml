[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "srna-annotation"
version = "0.1.0"
description = "End-to-end small-RNA sequencing annotation pipeline (Python)."
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
dependencies = [
    "pysam>=0.22",
    "pyranges>=0.0.130",
    "pandas>=2.0",
    "numpy>=1.26",
    "matplotlib>=3.8",
    "gffutils>=0.12",
    "tqdm>=4.66",
    "loguru>=0.7",
    "pyarrow>=15",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "ruff>=0.4",
    "black>=24",
]

[project.scripts]
srna = "srna.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
srna = ["py.typed"]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "D"]
ignore = ["D100", "D101", "D102", "D103", "D104", "D105", "D107", "D203", "D213"]

[tool.black]
line-length = 100
target-version = ["py312"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
